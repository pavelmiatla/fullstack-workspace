<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        color: #333;
        background-color: #f5f5f5;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
      }

      h1 {
        margin: 0 0 32px;
        padding: 0;
        font-size: 32px;
        color: #01579b;
      }

      #game-area {
        padding: 32px;
        background-color: #e0f2f1;
        border: 3px solid #01579b;
        font-size: 24px;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      #spin-button {
        padding: 20px;
        font-size: 32px;
        background-color: #388e3c;
        border-radius: 8px;
        border: none;
        color: white;
        margin-bottom: 24px;
      }

      #reset-button {
        padding: 12px;
        font-size: 18px;
        background-color: #01579b;
        border-radius: 8px;
        border: none;
        color: white;
      }

      #spin-button:hover,
      #reset-button:hover {
        transform: translateY(2px);
        transition: transform ease 0.3;
        cursor: pointer;
      }

      #result-message {
        font-size: 30px;
        color: #212121;
        margin-bottom: 16px;
        font-weight: bolder;
      }

      #stats-message {
        color: #212121;
        margin-bottom: 16px;
      }
    </style>
    <title>WoF</title>
  </head>
  <body>
    <h1>Wheel of Fortune</h1>
    <div id="game-area">
      <button id="spin-button">Spin a wheel</button>
      <div id="result-message">Dummy result</div>
      <div id="stats-message">Dummy stats</div>
      <button id="reset-button">Reset statistics</button>
    </div>

    <script>
      const API_URL = "http://localhost:3000/api/wheel";
      const spinBtn = document.getElementById("spin-button");
      const resetBtn = document.getElementById("reset-button");
      const resultMessage = document.getElementById("result-message");
      const statsMessage = document.getElementById("stats-message");

      async function fetchGameState() {
        try {
          const result = await fetch(API_URL);
          const gameState = await result.json();
          updateGameState(gameState);
        } catch (error) {
          resultMessage.innerText = `Cannot update the game state. Error on the BE side`;
          statsMessage.innerText = `Cannot update the game state. Error on the BE side`;
        }
      }

      /**
       * Update FE state with data retrieved from BE
       * @param  {gameState {wins: number; losses: number; lastResult: string}}
       * */
      function updateGameState(gameState) {
        if (gameState.lastResult === null) {
          resultMessage.innerText = `Make your new spin!`;
          statsMessage.innerText = `Wins: ${gameState.wins}| Losses: ${gameState.losses}`;
        } else if (gameState.lastResult === "Blank") {
          resultMessage.innerText = `Unlucky! Try again!`;
          statsMessage.innerText = `Wins: ${gameState.wins}| Losses: ${gameState.losses}`;
        } else {
          resultMessage.innerText = `Result: ${gameState.lastResult}`;
          statsMessage.innerText = `Wins: ${gameState.wins}| Losses: ${gameState.losses}`;
        }
      }

      async function spinWheel() {
        try {
          const result = await fetch(`${API_URL}/spin`, { method: "POST" });
          const gameState = await result.json();
          updateGameState(gameState);
        } catch (error) {
          resultMessage.innerText = `Cannot spin a wheel. Error on the BE side`;
          statsMessage.innerText = `Cannot spin a wheel. Error on the BE side`;
        }
      }

      async function resetStats() {
        try {
          statsMessage.innerHTML = "";
          const result = await fetch(`${API_URL}/reset`, { method: "POST" });
          const gameState = await result.json();
          updateGameState(gameState);
        } catch (error) {
          resultMessage.innerText = `Cannot reset statistics. Error on the BE side`;
          statsMessage.innerText = `Cannot reset statistics. Error on the BE side`;
        }
      }

      spinBtn.addEventListener("click", spinWheel);
      resetBtn.addEventListener("click", resetStats);

      fetchGameState();
    </script>
  </body>
</html>
